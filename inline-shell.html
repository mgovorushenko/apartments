/*__VIEWER_CSS__*/

  <div class="viz-controls apt-toolbar" aria-label="Управление моделью">
    <button type="button" class="btn" data-action="walls" aria-pressed="false">Стены: срез 1,35 м</button>
    <button type="button" class="btn" data-action="rough" aria-pressed="false">Черновой</button>
    <button type="button" class="btn" data-action="finished" aria-pressed="false">Чистовой</button>
    <button type="button" class="btn" data-action="furniture" aria-pressed="true">Мебель</button>

    <button type="button" class="btn" data-action="doors" aria-pressed="false">Закрыть двери</button>

    <canvas role="img" aria-label="Вращаемая трехмерная модель квартиры по плану"></canvas>
    <div class="apt-hint text-small">Мышь — поворот взгляда · WASD — движение · ↑/↓ — высота · ←/→ — поворот · колесо — вперёд/назад · Shift + мышь — сдвиг</div>

    ApartmentViewer.mount("apartment-3d-root", /*__SCENE_JSON__*/);
